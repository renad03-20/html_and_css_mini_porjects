<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<div class="section">
    <h1 class="title">what female friendships really is about?</h1>
     <div class="wrapper">
        <div class="container">
            <input type="radio" name="slide" id="c1" checked>
            <label for="c1" class="card">
                <div class="row">
                    <div class="icon">1</div>
                    <div class="description">
                        <h4>Nurturing</h4>
                        <p>
                            Quiet care and support shown through small, loving actions
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c2">
            <label for="c2" class="card">
                <div class="row">
                    <div class="icon">2</div>
                    <div class="description">
                        <h4>Comfort</h4>
                        <p>
                            Feeling safe enough to rest, lean, and just exist without effort.
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c3">
            <label for="c3" class="card">
                <div class="row">
                    <div class="icon">3</div>
                    <div class="description">
                        <h4>Admiration</h4>
                        <p>
                            A soft, warm look that shows appreciation and deep affection.
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c4">
            <label for="c4" class="card">
                <div class="row">
                    <div class="icon">4</div>
                    <div class="description">
                        <h4>Connection</h4>
                        <p>
                            An unspoken bond—you just feel understood without words.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c5">
            <label for="c5" class="card">
                <div class="row">
                    <div class="icon">5</div>
                    <div class="description">
                        <h4>Trust</h4>
                        <p>
                            Knowing you can rely on each other without doubt.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c6">
            <label for="c6" class="card">
                <div class="row">
                    <div class="icon">6</div>
                    <div class="description">
                        <h4>Loyalty</h4>
                        <p>
                            Standing by each other no matter what.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c7">
            <label for="c7" class="card">
                <div class="row">
                    <div class="icon">7</div>
                    <div class="description">
                        <h4>Warmth</h4>
                        <p>
                            A gentle, comforting presence that feels like home.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c8">
            <label for="c8" class="card">
                <div class="row">
                    <div class="icon">8</div>
                    <div class="description">
                        <h4>Ease</h4>
                        <p>
                            Being together without pressure—just natural and calm.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c9">
            <label for="c9" class="card">
                <div class="row">
                    <div class="icon">9</div>
                    <div class="description">
                        <h4>Joy</h4>
                        <p>
                            Sharing little happy moments that make everything lighter.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c10">
            <label for="c10" class="card">
                <div class="row">
                    <div class="icon">10</div>
                    <div class="description">
                        <h4>Support</h4>
                        <p>
                            Always there to lift each other up.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c11">
            <label for="c11" class="card">
                <div class="row">
                    <div class="icon">11</div>
                    <div class="description">
                        <h4>Closeness</h4>
                        <p>
                            That deep bond where distance doesn’t matter.
                        </p>
                    </div>
                </div>
            </label>
            <input type="radio" name="slide" id="c12">
            <label for="c12" class="card">
                <div class="row">
                    <div class="icon">12</div>
                    <div class="description">
                        <h4>Tenderness</h4>
                        <p>
                            Soft, caring gestures filled with affection.
                        </p>
                    </div>
                </div>
            </label>
        </div>
    </div>
</div>
</body>
</html>
